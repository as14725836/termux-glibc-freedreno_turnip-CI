name: Build Mesa-git

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
    - uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo apt update
        sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
            libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libexpat1-dev libwayland-dev python3-pip
          pip3 install --user meson ninja mako

    - name: Execute build script
      run: bash ./turnip_builder_upstream.sh

    - name: Release "turnip"
      uses: softprops/action-gh-release@v1
      with:
        body: |
          Mesa Turnip V${{ inputs.version }}  
          Built from: https://gitlab.freedesktop.org/mesa/mesa
          
          >[!WARNING]
          > GPUs other than A830/A840 may work unstable!

          This is a build of current upstream Mesa with my GPU enablement hacks applied
          
        tag_name: mesa_v${{ inputs.version }}
        name: Mesa Turnip v${{ inputs.version }}
        files: |
          /tmp/mesa-turnip-main-V${{ inputs.version }}.zip
